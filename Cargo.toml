[package]
name = "png"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "PNG decoder with strict resource limits: Go image/png behaviour and a libpng-lenient profile. Written for dobbo-ca; not a port."
publish = false

# dobbo-ca/deflate-rs, pinned by rev (never crates.io); the dobbo-ca-ci-read app token fetches it while that repo is private. Needs `zlib::Reader::with_buffer`.
[dependencies]
deflate = { git = "https://github.com/dobbo-ca/deflate-rs", rev = "442a2925289bc8ffc7dcf87076db8b76e645bf08" }

# The tests decode whole images; the dependencies run optimised under `cargo test`, this crate
# keeps overflow checks and debug assertions.
[profile.dev.package."*"]
opt-level = 2

# One codegen unit, so the decode loops inline across modules.
[profile.release]
codegen-units = 1
